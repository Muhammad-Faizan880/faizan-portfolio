<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- Enhanced Rich Dark Olive Base Gradient -->
    <linearGradient id="darkHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3A24"/>
      <stop offset="40%" stop-color="#222D1A"/>
      <stop offset="80%" stop-color="#1A2414"/>
      <stop offset="100%" stop-color="#141C10"/>
    </linearGradient>

    <!-- Deep Enhanced Aurora Glows (Rich Saturated Olive & Lime) -->
    <radialGradient id="auroraGlowRight" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8BB046" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#55732A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#141C10" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraGlowLeft" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#6F9233" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#3C501C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#141C10" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCenterSpot" cx="55%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A2CA50" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#141C10" stop-opacity="0"/>
    </radialGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .name-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .role-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
    </style>
  </defs>

  <!-- Background Base (Rich Dark Enhanced Olive) -->
  <rect width="1584" height="396" fill="url(#darkHeroBg)"/>
  <rect width="1584" height="396" fill="url(#auroraGlowRight)"/>
  <rect width="1584" height="396" fill="url(#auroraGlowLeft)"/>
  <rect width="1584" height="396" fill="url(#auroraCenterSpot)"/>

  <!-- Subtle Minimalist Grid Lines -->
  <g opacity="0.06" stroke="#C4E874" stroke-width="1">
    <line x1="0" y1="99" x2="1584" y2="99"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="297" x2="1584" y2="297"/>
    <line x1="396" y1="0" x2="396" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="1188" y1="0" x2="1188" y2="396"/>
  </g>

  <!-- Content Group (Positioned further to the RIGHT: x = 760) -->
  <g transform="translate(760, 0)">
    
    <!-- Name (Crisp Offwhite for strong contrast) -->
    <text x="0" y="142" class="name-text" font-size="52" fill="#F9FAF5">
      Muhammad Fizan
    </text>

    <!-- Title (Vibrant Lime-Olive for high-end accent) -->
    <text x="0" y="194" class="role-text" font-size="26" fill="#C4E874">
      Frontend Engineer &amp; UI Specialist
    </text>

    <!-- 5 Tech Stack Logos (Each 40px width/height inside clean modern badges) -->
    <g transform="translate(0, 236)">
      
      <!-- 1. React Logo (40x40) -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2ECD0" stroke-width="1.2"/>
        <g transform="translate(26, 26) scale(1.6)">
          <circle cx="0" cy="0" r="2.05" fill="#00D8FE" />
          <g stroke="#00D8FE" stroke-width="1" fill="none">
            <ellipse rx="11" ry="4.2" />
            <ellipse rx="11" ry="4.2" transform="rotate(60)" />
            <ellipse rx="11" ry="4.2" transform="rotate(120)" />
          </g>
        </g>
      </g>

      <!-- 2. Next.js Logo (40x40) -->
      <g transform="translate(70, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2ECD0" stroke-width="1.2"/>
        <g transform="translate(6, 6)">
          <svg width="40" height="40" viewBox="0 0 180 180" fill="none">
            <circle cx="90" cy="90" r="90" fill="#000000" />
            <path d="M149.5 157.5L69.1 54H54v72h12.1V69.4l73.9 95.4c3.3-2.2 6.5-4.6 9.5-7.3z" fill="#FFFFFF" />
            <path d="M115 54h12v72h-12z" fill="#FFFFFF" />
          </svg>
        </g>
      </g>

