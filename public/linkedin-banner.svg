<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <!-- 1. Hero-Matching Light Luminous Canvas Base Gradient -->
    <linearGradient id="heroBaseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF3"/>
      <stop offset="55%" stop-color="#EBF3DF"/>
      <stop offset="100%" stop-color="#DDE8CD"/>
    </linearGradient>

    <!-- 2. Left Side Organic Gradient Aura Effect (Luminous Olive & Lime from Site Hero) -->
    <radialGradient id="auraLeftTop" cx="14%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#C0E675" stop-opacity="0.52"/>
      <stop offset="45%" stop-color="#A3C663" stop-opacity="0.26"/>
      <stop offset="85%" stop-color="#EBF3DF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraLeftBottom" cx="24%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#AFDB62" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8FA858" stop-opacity="0.22"/>
      <stop offset="90%" stop-color="#DDE8CD" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraCenterSoft" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#CAD6BA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F7FAF3" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for crisp subtle drop-shadow on badges -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2D3A20" flood-opacity="0.08"/>
    </filter>

    <!-- Node.js Official Brand Gradients -->
    <linearGradient id="node-a" x1="34.513" x2="27.157" y1="15.535" y2="30.448" gradientTransform="translate(-129.242 -73.715) scale(6.18523)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F873F"/>
      <stop offset=".33" stop-color="#3F8B3D"/>
      <stop offset=".637" stop-color="#3E9638"/>
      <stop offset=".934" stop-color="#3DA92E"/>
      <stop offset="1" stop-color="#3DAE2B"/>
    </linearGradient>
    <linearGradient id="node-b" x1="30.009" x2="50.533" y1="23.359" y2="8.288" gradientTransform="translate(-129.242 -73.715) scale(6.18523)" gradientUnits="userSpaceOnUse">
      <stop offset=".138" stop-color="#3F873F"/>
      <stop offset=".402" stop-color="#52A044"/>
      <stop offset=".713" stop-color="#64B749"/>
      <stop offset=".908" stop-color="#6ABF4B"/>
    </linearGradient>
    <linearGradient id="node-c" x1="21.917" x2="40.555" y1="22.261" y2="22.261" gradientTransform="translate(-129.242 -73.715) scale(6.18523)" gradientUnits="userSpaceOnUse">
      <stop offset=".092" stop-color="#6ABF4B"/>
      <stop offset=".287" stop-color="#64B749"/>
      <stop offset=".598" stop-color="#52A044"/>
      <stop offset=".862" stop-color="#3F873F"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .name-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .role-text {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
    </style>
  </defs>

  <!-- Base Canvas (Hero Section Light Theme) -->
  <rect width="1584" height="396" fill="url(#heroBaseBg)"/>

  <!-- Left Side Glowing Organic Gradient Auras -->
  <rect width="1584" height="396" fill="url(#auraLeftTop)"/>
  <rect width="1584" height="396" fill="url(#auraLeftBottom)"/>
  <rect width="1584" height="396" fill="url(#auraCenterSoft)"/>

  <!-- Subtle Minimalist Grid Texture from Portfolio -->
  <g opacity="0.07" stroke="#525E37" stroke-width="1">
    <line x1="0" y1="99" x2="1584" y2="99"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="297" x2="1584" y2="297"/>
    <line x1="396" y1="0" x2="396" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="1188" y1="0" x2="1188" y2="396"/>
  </g>

  <!-- Content Group (Positioned on the RIGHT: x = 780 to guarantee avatar safety) -->
  <g transform="translate(780, 0)">
    
    <!-- Name (Deep Rich Charcoal/Olive-950 for high-contrast crisp readability) -->
    <text x="0" y="140" class="name-text" font-size="52" fill="#182011">
      Muhammad Fizan
    </text>

    <!-- Title (Rich Olive-700 matching Hero typography) -->
    <text x="0" y="192" class="role-text" font-size="25" fill="#525E37">
      Frontend Engineer &amp; UI Specialist
    </text>

    <!-- 7 Real-Time Tech Stack Logos (All identical 36x36 inside 52x52 badges) -->
    <g transform="translate(0, 234)">
      
      <!-- 1. React Logo -->
      <g transform="translate(0, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(26, 26) scale(1.5)">
          <circle cx="0" cy="0" r="2.05" fill="#00D8FE" />
          <g stroke="#00D8FE" stroke-width="1" fill="none">
            <ellipse rx="11" ry="4.2" />
            <ellipse rx="11" ry="4.2" transform="rotate(60)" />
            <ellipse rx="11" ry="4.2" transform="rotate(120)" />
          </g>
        </g>
      </g>

      <!-- 2. Next.js Logo -->
      <g transform="translate(66, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(8, 8)">
          <svg width="36" height="36" viewBox="0 0 180 180" fill="none">
            <circle cx="90" cy="90" r="90" fill="#000000" />
            <path d="M149.5 157.5L69.1 54H54v72h12.1V69.4l73.9 95.4c3.3-2.2 6.5-4.6 9.5-7.3z" fill="#FFFFFF" />
            <path d="M115 54h12v72h-12z" fill="#FFFFFF" />
          </svg>
        </g>
      </g>

      <!-- 3. TypeScript Logo -->
      <g transform="translate(132, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(8, 8)">
          <svg width="36" height="36" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="20" fill="#3178C6" />
            <path fill="#ffffff" d="M68.7 78.4c1.9 3.5 4.5 6.3 7.8 8.4 3.3 2.1 7.2 3.2 11.7 3.2 3.6 0 6.6-.7 9-2.1 2.4-1.4 4.2-3.3 5.4-5.7 1.2-2.4 1.8-5.1 1.8-8.1 0-3-.6-5.5-1.8-7.7-1.2-2.2-3.1-4-5.6-5.4-2.5-1.4-6-2.8-10.3-4.1-5.1-1.6-9.1-3.2-12-4.9-2.9-1.7-5-3.8-6.3-6.4-1.3-2.6-2-5.7-2-9.3 0-4.3 1.1-8.1 3.4-11.4 2.3-3.3 5.5-5.9 9.8-7.8s9.3-2.9 15.2-2.9c5.9 0 11.1 1.1 15.6 3.4s8.1 5.5 10.8 9.6l-13.6 8.5c-1.8-2.7-4-4.7-6.5-6.1s-5.6-2.1-9.2-2.1c-3.1 0-5.7.6-7.8 1.9-2.1 1.2-3.1 3-3.1 5.4 0 2.1.8 3.8 2.3 5 1.5 1.2 4.3 2.4 8.4 3.7 5.6 1.7 10 3.5 13.1 5.3 3.1 1.8 5.4 4.1 6.9 6.8 1.5 2.7 2.3 6.1 2.3 10 0 4.6-1.2 8.7-3.6 12.3-2.4 3.6-5.9 6.5-10.4 8.6-4.5 2.1-9.9 3.2-16.2 3.2-6.9 0-13-1.4-18.3-4.2-5.3-2.8-9.4-7-12.3-12.5l14.1-8.5zM21.1 34.6h47.2v14.1H48.1v64.7H31.3V48.7H21.1V34.6z"/>
          </svg>
        </g>
      </g>

      <!-- 4. Tailwind CSS Logo -->
      <g transform="translate(198, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(8, 8)">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="#38BDF8">
            <path d="M12.001 4.8c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624C13.666 10.618 15.027 12 18.001 12c3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C16.337 6.182 14.976 4.8 12.001 4.8zm-6 7.2c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624 1.177 1.194 2.538 2.576 5.512 2.576 3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C10.337 13.382 8.976 12 6.001 12z" />
          </svg>
        </g>
      </g>

      <!-- 5. JavaScript Logo -->
      <g transform="translate(264, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(8, 8)">
          <svg width="36" height="36" viewBox="0 0 630 630">
            <rect width="630" height="630" rx="90" fill="#F7DF1E" />
            <path fill="#000000" d="m423.2 492.19c12.69 20.72 29.2 35.95 58.4 35.95 24.53 0 40.2-12.26 40.2-29.2 0-20.3-16.1-27.49-43.1-39.3l-14.8-6.35c-42.72-18.2-71.1-41-71.1-89.2 0-44.4 33.83-78.2 86.7-78.2 37.64 0 64.7 13.1 84.2 47.4l-46.1 29.6c-10.15-18.2-21.1-25.4-38.1-25.4-17.34 0-28.33 11-28.33 25.4 0 17.8 11 24.9 36.4 35.9l14.8 6.34c50.3 21.57 78.7 43.57 78.7 93 0 53.3-41.87 82.5-98.1 82.5-54.98 0-90.5-26.2-107.88-60.54zm-209.13 5.13c9.3 16.5 17.76 30.45 38.1 30.45 19.45 0 31.72-7.61 31.72-37.2v-201.3h59.2v202.1c0 61.3-35.94 89.2-88.4 89.2-47.4 0-74.85-24.53-88.81-54.075z"/>
          </svg>
        </g>
      </g>

      <!-- 6. Node.js Logo (Official 3D Hexagon with Brand Gradients) -->
      <g transform="translate(330, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(8, 8)">
          <svg width="36" height="36" viewBox="0 0 128 128">
            <path fill="url(#node-a)" d="M66.958.825a6.07 6.07 0 0 0-6.035 0L11.103 29.76c-1.895 1.072-2.96 3.095-2.96 5.24v57.988c0 2.143 1.183 4.167 2.958 5.24l49.82 28.934a6.07 6.07 0 0 0 6.036 0l49.82-28.935c1.894-1.072 2.958-3.096 2.958-5.24V35c0-2.144-1.183-4.167-2.958-5.24z"/>
            <path fill="url(#node-b)" d="M116.897 29.76 66.841.825A8.161 8.161 0 0 0 65.302.23L9.21 96.798a6.251 6.251 0 0 0 1.657 1.43l50.057 28.934c1.42.833 3.076 1.072 4.615.595l52.66-96.925a3.702 3.702 0 0 0-1.302-1.072z"/>
            <path fill="url(#node-c)" d="M116.898 98.225c1.42-.833 2.485-2.262 2.958-3.81L65.066.108c-1.42-.238-2.959-.119-4.26.715L11.104 29.639l53.606 98.355c.71-.12 1.54-.358 2.25-.715z"/>
          </svg>
        </g>
      </g>

      <!-- 7. Redux Toolkit Logo (Official Tri-Loop) -->
      <g transform="translate(396, 0)">
        <rect width="52" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.95" stroke="#CAD6BA" stroke-width="1.2" filter="url(#badgeShadow)"/>
        <g transform="translate(8, 8)">
          <svg width="36" height="36" viewBox="0 0 128 128">
            <path fill="#764ABC" d="M88.69 88.11c-9 18.4-24.76 30.78-45.61 34.85a39.73 39.73 0 0 1-9.77 1.14c-12 0-23-5-28.34-13.19C-2.2 100-4.64 76.87 19 59.76c.48 2.61 1.46 6.19 2.11 8.31A38.24 38.24 0 0 0 10 81.1c-4.4 8.64-3.91 17.27 1.3 25.25 3.6 5.38 9.3 8.65 16.63 9.65a44 44 0 0 0 26.55-5c12.71-6.68 21.18-14.66 26.72-25.57a9.32 9.32 0 0 1-2.61-6A9.12 9.12 0 0 1 87.37 70h.34a9.15 9.15 0 0 1 1 18.25zm28.67-20.2c12.21 13.84 12.54 30.13 7.82 39.58-4.4 8.63-16 17.27-31.6 17.27a50.48 50.48 0 0 1-21-5.05c2.29-1.63 5.54-4.24 7.33-5.87a41.54 41.54 0 0 0 16 3.42c10.1 0 17.75-4.72 22.31-13.35 2.93-5.7 3.1-12.38.33-19.22a43.61 43.61 0 0 0-17.27-20.85 62 62 0 0 0-34.74-10.59h-2.93a9.21 9.21 0 0 1-8 5.54h-.31a9.13 9.13 0 0 1-.3-18.25h.33a9 9 0 0 1 8 4.89h2.61c20.8 0 39.06 7.98 51.42 22.48zm-82.75 23a7.31 7.31 0 0 1 1.14-4.73c-9.12-15.8-14-35.83-6.51-56.68C34.61 13.83 48.13 3.24 62.79 3.24c15.64 0 31.93 13.69 33.88 40.07-2.44-.81-6-2-8.14-2.44-.53-8.63-7.82-30.13-25.09-29.81-6.19.17-15.31 3.1-20 9.12a43.69 43.69 0 0 0-9.64 25.25 59.61 59.61 0 0 0 8.47 36.16 2.75 2.75 0 0 1 1.14-.16h.32a9.121 9.121 0 0 1 .33 18.24h-.33a9.16 9.16 0 0 1-9.12-8.79z"/>
          </svg>
        </g>
      </g>

    </g>
  </g>
</svg>
