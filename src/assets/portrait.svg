<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="100%" height="100%">
  <defs>
    <!-- Cinematic Lighting Gradients in Olive, Sage & Charcoal -->
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#F8F8F4" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#E5E6DC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D6DAC8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="skinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EADBCC" />
      <stop offset="50%" stop-color="#D8C5B2" />
      <stop offset="100%" stop-color="#BCA590" />
    </linearGradient>

    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252820" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#141712" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#343A2C" />
      <stop offset="50%" stop-color="#252820" />
      <stop offset="100%" stop-color="#181B14" />
    </linearGradient>

    <linearGradient id="oliveRimLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#687548" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#687548" stop-opacity="0" />
    </linearGradient>

    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="editorialShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#252820" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="350" cy="380" r="320" fill="url(#faceGlow)" />

  <!-- Background Depth Silhouette Aura -->
  <circle cx="350" cy="380" r="280" fill="none" stroke="#687548" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />
  <circle cx="350" cy="380" r="260" fill="none" stroke="#E5E6DC" stroke-width="1" opacity="0.6" />

  <!-- Main Developer Portrait Artwork (Cinematic Artistic Lighting) -->
  <g filter="url(#editorialShadow)">
    <!-- Back Torso & Shoulders -->
    <path d="M120 780 C120 560, 210 500, 350 500 C490 500, 580 560, 580 780 C580 840, 120 840, 120 780 Z" fill="url(#shadowGrad)" />

    <!-- Blazer Left Lapel with Olive Rim Light Accent -->
    <path d="M220 520 L320 720 L350 780 L290 780 L180 620 Z" fill="#2E3326" />
    <path d="M140 580 C150 540, 190 515, 240 505" stroke="#687548" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Blazer Right Lapel with Crisp Shadow -->
    <path d="M480 520 L380 720 L350 780 L410 780 L520 620 Z" fill="#1C1F17" />

    <!-- Inner Crisp White Shirt Collar -->
    <path d="M305 480 L350 620 L395 480 L370 470 L350 510 L330 470 Z" fill="#F8F8F4" />
    <path d="M350 520 L350 700" stroke="#E5E6DC" stroke-width="2" />

    <!-- Neck & Jawline with Chiaroscuro Shadowing -->
    <path d="M310 390 L310 500 C330 515, 370 515, 390 500 L390 390 Z" fill="#C8B39E" />
    <!-- Neck Shadow Triangle -->
    <path d="M310 400 Q350 470 390 400 L390 440 Q350 490 310 440 Z" fill="#252820" opacity="0.25" />

    <!-- Face Base -->
    <path d="M250 260 C250 150, 450 150, 450 260 C450 370, 420 440, 350 440 C280 440, 250 370, 250 260 Z" fill="url(#skinGrad)" />

    <!-- Right Side Dramatic Shadow (Chiaroscuro Half-Tone as in reference) -->
    <path d="M350 160 C400 160, 450 200, 450 260 C450 370, 420 440, 350 440 C360 380, 365 300, 350 160 Z" fill="#252820" opacity="0.32" />

    <!-- Distinctive Styled Hair (Volumetric & Flowing like creative reference) -->
    <path d="M220 230 C200 130, 290 80, 400 95 C490 110, 500 190, 475 250 C460 210, 450 170, 400 140 C340 105, 260 130, 240 210 Z" fill="url(#hairGrad)" />
    <!-- Additional Hair Strands & Volume -->
    <path d="M240 180 C210 110, 330 70, 440 90 C410 75, 300 75, 230 140 C210 160, 215 220, 220 250 C230 210, 240 195, 250 185 Z" fill="#3D4434" />
    <path d="M410 100 C470 120, 490 180, 480 230 C490 190, 480 140, 430 110 Z" fill="#1B1E16" />

    <!-- Modern Minimalist Eyewear / Glasses in Rich Olive & Wireframe -->
    <rect x="270" y="270" width="65" height="42" rx="12" fill="none" stroke="#252820" stroke-width="4.5" />
    <rect x="365" y="270" width="65" height="42" rx="12" fill="none" stroke="#252820" stroke-width="4.5" />
    <line x1="335" y1="288" x2="365" y2="288" stroke="#687548" stroke-width="4.5" />
    <!-- Glass Lens Tint -->
    <rect x="272" y="272" width="61" height="38" rx="10" fill="#687548" opacity="0.12" />
    <rect x="367" y="272" width="61" height="38" rx="10" fill="#252820" opacity="0.2" />

    <!-- Eyes Behind Glass -->
    <ellipse cx="302" cy="290" rx="8" ry="4.5" fill="#252820" />
    <circle cx="304" cy="289" r="2" fill="#F8F8F4" />
    <ellipse cx="398" cy="290" rx="8" ry="4.5" fill="#252820" />
    <circle cx="400" cy="289" r="2" fill="#F8F8F4" />

    <!-- Nose Contour & Shadow -->
    <path d="M344 285 L352 340 L338 348" stroke="#252820" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5" />

    <!-- Confident Subtle Smile -->
    <path d="M325 385 Q350 402 375 385" stroke="#252820" stroke-width="3.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Editorial Floating UI Badges on the Portrait (Studio Signature) -->
  <g transform="translate(60, 180)">
    <rect width="180" height="44" rx="14" fill="#FFFFFF" stroke="#E5E6DC" stroke-width="1.5" filter="url(#editorialShadow)" />
    <circle cx="24" cy="22" r="5" fill="#687548" />
    <text x="38" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#252820">Muhammad Faizan</text>
  </g>

  <g transform="translate(450, 680)">
    <rect width="200" height="50" rx="16" fill="#687548" filter="url(#editorialShadow)" />
    <text x="100" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8F8F4" text-anchor="middle">Frontend Developer • 3 YOE</text>
  </g>
</svg>

